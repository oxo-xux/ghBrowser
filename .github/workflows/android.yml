name: Android

run-name: "GB Android"

on:
  workflow_dispatch:
    inputs:
      duration:
        description: "Run duration in minutes (5-360)"
        required: false
        default: "60"
      auth_mode:
        description: "VNC login page protection"
        required: false
        default: "password"
        type: choice
        options:
          - password
          - none
      vnc_password:
        description: "Session password (empty = BASIC_AUTH_PASSWORD secret)"
        required: false
        default: ""
      emulator_device:
        description: "Google services (GAPPS=with Play Store, VANILLA=clean)"
        required: false
        default: "GAPPS"
        type: choice
        options:
          - GAPPS
          - VANILLA
      screen:
        description: "Display size (landscape = gaming)"
        required: false
        default: "1920x1080"
        type: choice
        options:
          - 1920x1080
          - 1280x720
          - 720x1280
      session_id:
        description: "Bot session id (for run tracking)"
        required: false
        default: ""
      user_id:
        description: "Discord user id (for DM delivery)"
        required: false
        default: ""
      callback_url:
        description: "Fixed n8n webhook https://n8n.aam.sryze.cc/webhook/ghbrowser-deliver (or override)"
        required: false
        default: ""

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v5

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          ls -l /dev/kvm || echo "WARNING: /dev/kvm missing, emulator will be slow"

      - name: Start Android (dockerify + scrcpy-web)
        run: |
          for img in shmayro/dockerify-android:latest shmayro/scrcpy-web:latest; do
            for i in 1 2 3 4 5; do
              if docker pull -q "$img" > /dev/null 2>&1; then break; fi
              echo "image pull $img failed (attempt $i/5), retrying..."
              sleep $((i * 20))
              if [ "$i" = "5" ]; then echo "ERROR: could not pull $img"; exit 1; fi
            done
          done
          KVM_FLAG=""
          if [ -e /dev/kvm ]; then KVM_FLAG="--device /dev/kvm"; fi
          VARIANT="${{ github.event.inputs.emulator_device || 'GAPPS' }}"
          if [ "$VARIANT" = "VANILLA" ]; then GAPPS_SETUP=0; else GAPPS_SETUP=1; fi
          SCREEN="${{ github.event.inputs.screen || '1920x1080' }}"
          case "$SCREEN" in
            1920x1080) DENSITY=240 ;;
            1280x720) DENSITY=240 ;;
            720x1280) DENSITY=320 ;;
            *) SCREEN=1920x1080; DENSITY=240 ;;
          esac
          echo "Display: $SCREEN @ $DENSITY dpi (landscape = gaming)"
          docker network create android-net || true
          docker run -d \
            --name dockerify-android \
            --network android-net \
            --privileged \
            $KVM_FLAG \
            --shm-size=2g \
            -p 5555:5555 \
            -e DNS=one.one.one.one \
            -e ROOT_SETUP=1 \
            -e GAPPS_SETUP="$GAPPS_SETUP" \
            -e ARM_TRANSLATION=1 \
            -e SCREEN_RESOLUTION="$SCREEN" \
            -e SCREEN_DENSITY="$DENSITY" \
            shmayro/dockerify-android:latest
          docker run -d \
            --name scrcpy-web \
            --network android-net \
            --privileged \
            -p 8000:8000 \
            shmayro/scrcpy-web:latest \
            sh -c "for i in 1 2 3 4 5 6; do adb connect dockerify-android:5555 && break; sleep 10; done; npm start"
          docker ps
          sleep 15
          docker logs dockerify-android --tail 30 || true
          docker logs scrcpy-web --tail 30 || true

      - name: Wait for web UI
        run: |
          for i in $(seq 1 60); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000 2>/dev/null || true)
            if [ "$STATUS" = "200" ]; then
              echo "scrcpy-web ready."
              break
            fi
            echo "waiting web UI... ($i/60) status=$STATUS"
            sleep 10
          done
          curl -s -o /dev/null -w "web UI check done: %{http_code}\n" http://localhost:8000 || true

      - name: Run automated demo tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq android-tools-adb
          echo "=== emulator status ==="
          docker logs dockerify-android --tail 20 || true
          echo "=== adb connect ==="
          for i in $(seq 1 30); do
            adb connect localhost:5555 || true
            adb devices
            if adb -s localhost:5555 shell getprop sys.boot_completed 2>/dev/null | grep -q "1"; then
              echo "Android booted."
              break
            fi
            echo "waiting boot... ($i/30)"
            docker logs dockerify-android --tail 5 || true
            sleep 20
          done
          echo "=== demo assertions ==="
          adb -s localhost:5555 wait-for-device
          adb -s localhost:5555 shell getprop ro.build.version.release
          adb -s localhost:5555 shell getprop ro.product.model
          adb -s localhost:5555 shell dumpsys battery | head -20 || true
          echo "=== screenshot ==="
          adb -s localhost:5555 shell screencap -p /sdcard/screen.png
          adb -s localhost:5555 pull /sdcard/screen.png ./android-screen.png
          ls -lh ./android-screen.png
          echo "TEST PASSED: dockerify boot + adb + screencap OK"

      - name: Upload screenshot proof
        uses: actions/upload-artifact@v4
        with:
          name: android-screen
          path: android-screen.png
          if-no-files-found: warn

      - name: Reconnect scrcpy-web to booted emulator
        run: |
          echo "=== reconnect scrcpy-web now that emulator is fully booted ==="
          docker exec scrcpy-web adb disconnect || true
          docker exec scrcpy-web adb connect dockerify-android:5555
          docker exec scrcpy-web adb devices
          docker restart scrcpy-web
          sleep 10
          docker exec scrcpy-web sh -c "for i in 1 2 3 4 5 6; do adb connect dockerify-android:5555 && break; sleep 5; done; adb devices" || true
          for i in $(seq 1 30); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000 2>/dev/null || true)
            if [ "$STATUS" = "200" ]; then echo "scrcpy-web reconnected."; break; fi
            sleep 5
          done
          docker logs scrcpy-web --tail 20 || true

      - name: Setup auth proxy + login page
        env:
          INPUT_PASSWORD: ${{ inputs.vnc_password }}
          FALLBACK_PASSWORD: ${{ secrets.BASIC_AUTH_PASSWORD }}
          AUTH_MODE: ${{ inputs.auth_mode }}
        run: |
          WPASSWORD="$INPUT_PASSWORD"
          if [ "$AUTH_MODE" = "none" ]; then
            WPASSWORD=""
          elif [ -z "$WPASSWORD" ]; then
            WPASSWORD="$FALLBACK_PASSWORD"
          fi
          if [ -z "$WPASSWORD" ] && [ "$AUTH_MODE" != "none" ]; then
            echo "ERROR: auth_mode=password but no vnc_password input and no BASIC_AUTH_PASSWORD secret"
            exit 1
          fi
          if [ -n "$WPASSWORD" ]; then
            echo "::add-mask::$WPASSWORD"
          fi
          PROXY_PASSWORD="$WPASSWORD" UPSTREAM_PORT=8000 UPSTREAM_HOST=127.0.0.1 nohup python3 .github/scripts/proxy.py > /tmp/proxy.log 2>&1 &
          sleep 2
          curl -s -o /dev/null -w "Login page ready.\n" http://localhost:8080/auth/login

      - name: Install cloudflared
        run: |
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            -o cloudflared
          chmod +x cloudflared

      - name: Start tunnel
        run: |
          DURATION=${{ github.event.inputs.duration || '60' }}
          if ! [[ "$DURATION" =~ ^[0-9]+$ ]] || [ "$DURATION" -lt 5 ]; then DURATION=5; fi
          if [ "$DURATION" -gt 360 ]; then DURATION=360; fi

          for i in $(seq 1 10); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/auth/login 2>/dev/null || true)
            if [ "$STATUS" = "200" ]; then
              echo "Proxy ready."
              break
            fi
            sleep 2
          done

          ./cloudflared tunnel --url http://localhost:8080 > tunnel.log 2>&1 &

          for i in $(seq 1 60); do
            if grep -o 'https://[^ ]*\.trycloudflare\.com' tunnel.log > /dev/null 2>&1; then
              URL=$(grep -o 'https://[^ ]*\.trycloudflare\.com' tunnel.log | head -1)
              echo "::add-mask::$URL"
              echo "Tunnel is live. Link + credentials sent privately to the requester."
              echo "## ghBrowser (Android) session live" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "Session `${{ inputs.session_id }}` is live. Link + credentials delivered privately to the requester." >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "Device `dockerify Android 13 ${{ github.event.inputs.emulator_device || 'GAPPS' }} ${{ github.event.inputs.screen || '1920x1080' }}` (scrcpy-web H264). Open URL -> login -> H264 Converter -> fullscreen button for gaming." >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "Expires in $DURATION minutes." >> $GITHUB_STEP_SUMMARY
              break
            fi
            sleep 5
          done

          CALLBACK_URL="${{ github.event.inputs.callback_url }}"
          if [ -z "$CALLBACK_URL" ]; then
            CALLBACK_URL="${{ secrets.GHBROWSER_CALLBACK_URL }}"
          fi
          # Display password for the DM: user's own password if given,
          # otherwise the default. Never the repo fallback secret.
          PW_DISPLAY="${{ inputs.vnc_password }}"
          if [ -z "$PW_DISPLAY" ]; then
            PW_DISPLAY="pass123"
          fi
          echo "::add-mask::$PW_DISPLAY"
          if [ -n "$CALLBACK_URL" ] && [ -n "${URL:-}" ]; then
            echo "Notifying bot callback..."
            CB_SECRET="${{ secrets.GHBROWSER_CALLBACK_SECRET }}"
            if [ -z "$CB_SECRET" ]; then
              echo "WARNING: GHBROWSER_CALLBACK_SECRET repo secret not set, skipping callback"
            else
            PAYLOAD=$(jq -n \
              --arg secret "$CB_SECRET" \
              --arg session "${{ inputs.session_id }}" \
              --arg user "${{ inputs.user_id }}" \
              --argjson run "${{ github.run_id }}" \
              --arg browser "Android" \
              --arg url "$URL" \
              --arg auth "${{ inputs.auth_mode }}" \
              --arg pw "$PW_DISPLAY" \
              --arg dur "$DURATION" \
              --arg status "live" \
              '{secret:$secret, session_id:$session, user_id:$user, run_id:$run, browser:$browser, url:$url, auth_mode:$auth, password:$pw, duration_min:($dur|tonumber), status:$status}')
            for attempt in 1 2 3; do
              if curl -fsSL -m 20 -X POST "$CALLBACK_URL" \
                -H 'Content-Type: application/json' \
                -H "X-Ghbrowser-Secret: $CB_SECRET" -d "$PAYLOAD"; then
                echo "Callback delivered (attempt $attempt)"
                break
              fi
              echo "Callback failed (attempt $attempt), retrying..."
              sleep 10
            done
            unset CB_SECRET PAYLOAD
            fi
          fi

          echo "Keeping alive for $DURATION minutes..."
          sleep ${DURATION}m

          # Session over: tell n8n so the DM flips to deleted.
          DELIVER_URL="${{ github.event.inputs.callback_url }}"
          if [ -z "$DELIVER_URL" ]; then
            DELIVER_URL="${{ secrets.GHBROWSER_CALLBACK_URL }}"
          fi
          if [ -n "$DELIVER_URL" ]; then
            CB_SECRET2="${{ secrets.GHBROWSER_CALLBACK_SECRET }}"
            if [ -n "$CB_SECRET2" ]; then
              echo "Notifying session end..."
              END_PAYLOAD=$(jq -n \
                --arg secret "$CB_SECRET2" \
                --arg session "${{ inputs.session_id }}" \
                --arg user "${{ inputs.user_id }}" \
                --argjson run "${{ github.run_id }}" \
                --arg browser "Android" \
                --arg dur "$DURATION" \
                --arg status "deleted" \
                '{secret:$secret, session_id:$session, user_id:$user, run_id:$run, browser:$browser, duration_min:($dur|tonumber), status:$status}')
              curl -fsSL -m 15 -X POST "$DELIVER_URL" \
                -H 'Content-Type: application/json' \
                -H "X-Ghbrowser-Secret: $CB_SECRET2" -d "$END_PAYLOAD" \
                && echo "End callback delivered" || echo "End callback failed (best effort)"
              unset CB_SECRET2 END_PAYLOAD
            fi
          fi
