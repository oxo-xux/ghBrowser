name: Brave

run-name: "GB Brave"

on:
  workflow_dispatch:
    inputs:
      duration:
        description: "Run duration in minutes (5-360)"
        required: false
        default: "60"
      auth_mode:
        description: "Login page protection"
        required: false
        default: "password"
        type: choice
        options:
          - password
          - none
      vnc_password:
        description: "Session password (empty = BASIC_AUTH_PASSWORD secret)"
        required: false
        default: ""

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v5

      - name: Start browser
        run: |
          sudo mkdir -p /home/files/shared
          sudo chmod 777 /home/files/shared
          for i in 1 2 3 4 5; do
            if docker pull -q lscr.io/linuxserver/brave:latest > /dev/null 2>&1; then break; fi
            echo "image pull failed (attempt $i/5), retrying..."
            sleep $((i * 20))
            if [ "$i" = "5" ]; then echo "ERROR: could not pull browser image"; exit 1; fi
          done
          docker run -d \
            --name browser \
            --hostname brave \
            --dns=94.140.14.15 \
            --dns=94.140.15.16 \
            -v /home/files/shared:/shared \
            --shm-size=2g \
            -p 3000:3000 \
            -e PUID=1000 \
            -e PGID=1000 \
            -e TZ=Etc/UTC \
            -e TITLE=ghBrowser-Brave \
            lscr.io/linuxserver/brave:latest

      - name: Verify shared folder mount
        run: |
          echo "mount-ok" | sudo tee /home/files/shared/.mount-test > /dev/null
          docker exec browser cat /shared/.mount-test | grep -q mount-ok && echo "Shared folder mount OK (browser /shared <-> host /home/files/shared)." || { echo "ERROR: /shared mount broken"; exit 1; }
          sudo rm -f /home/files/shared/.mount-test

      - name: Lock browser (FamilySafe - no DoH, force SafeSearch)
        run: |
          docker exec browser bash -c '
            echo "" | base64 -d > /tmp/ghbrowser-family.json
            for d in /etc/brave/policies/managed /etc/opt/brave/policies/managed /etc/chromium/policies/managed /etc/opt/chrome/policies/managed; do
              mkdir -p "$d" && cp /tmp/ghbrowser-family.json "$d/family-safe.json"
            done
            grep -q "DnsOverHttpsMode" /etc/brave/policies/managed/family-safe.json && echo "Brave FamilySafe policies installed."
            MYSELF=$$
            for p in $(pgrep -f '[b]rave' 2>/dev/null || true); do
              if [ "$p" != "$MYSELF" ]; then kill "$p" 2>/dev/null || true; fi
            done
          '

      - name: Wait for browser
        run: |
          for i in $(seq 1 120); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000 2>/dev/null || true)
            if [ "$STATUS" = "200" ] || [ "$STATUS" = "401" ]; then
              echo "Browser ready."
              sleep 10
              break
            fi
            sleep 5
          done

      - name: Rename user to brave
        run: |
          docker exec browser bash -c '
            usermod -l brave abc &&
            groupmod -n brave abc &&
            usermod -d /home/brave -m brave &&
            chown -R brave:brave /home/brave
          ' 2>/dev/null || true

      - name: Setup auth proxy + login page
        env:
          INPUT_PASSWORD: ${{ inputs.vnc_password }}
          FALLBACK_PASSWORD: ${{ secrets.BASIC_AUTH_PASSWORD }}
          AUTH_MODE: ${{ inputs.auth_mode }}
        run: |
          WPASSWORD="$INPUT_PASSWORD"
          if [ "$AUTH_MODE" = "none" ]; then
            WPASSWORD=""
          elif [ -z "$WPASSWORD" ]; then
            WPASSWORD="$FALLBACK_PASSWORD"
          fi
          if [ -z "$WPASSWORD" ] && [ "$AUTH_MODE" != "none" ]; then
            echo "ERROR: auth_mode=password but no vnc_password input and no BASIC_AUTH_PASSWORD secret"
            exit 1
          fi
          if [ -n "$WPASSWORD" ]; then
            echo "::add-mask::$WPASSWORD"
          fi
          PROXY_PASSWORD="$WPASSWORD" nohup python3 .github/scripts/proxy.py > /tmp/proxy.log 2>&1 &
          sleep 2
          curl -s -o /dev/null -w "Login page ready.\n" http://localhost:8080/auth/login

      - name: Install cloudflared
        run: |
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            -o cloudflared
          chmod +x cloudflared

      - name: Start SFTP file access (same session password)
        env:
          INPUT_PASSWORD: ${{ inputs.vnc_password }}
          FALLBACK_PASSWORD: ${{ secrets.BASIC_AUTH_PASSWORD }}
          AUTH_MODE: ${{ inputs.auth_mode }}
        run: |
          if [ "$AUTH_MODE" = "none" ]; then
            echo "auth_mode=none - SFTP file access disabled (no password to protect it)."
            echo "UNAVAILABLE" > /tmp/sftp_state
            exit 0
          fi
          FPASSWORD="$INPUT_PASSWORD"
          if [ -z "$FPASSWORD" ]; then
            FPASSWORD="$FALLBACK_PASSWORD"
          fi
          if [ -z "$FPASSWORD" ]; then
            echo "ERROR: SFTP needs a password but no vnc_password input and no BASIC_AUTH_PASSWORD secret"
            exit 1
          fi
          echo "::add-mask::$FPASSWORD"

          echo "Installing OpenSSH server..."
          for i in 1 2 3; do
            if sudo apt-get update -qq && sudo apt-get install -y -qq openssh-server; then break; fi
            echo "apt failed (attempt $i/3), retrying..."
            sleep 10
            if [ "$i" = "3" ]; then echo "ERROR: could not install openssh-server"; exit 1; fi
          done

          echo "Creating SFTP user..."
          sudo useradd -m -s /bin/bash files 2>/dev/null || true
          echo "files:$FPASSWORD" | sudo chpasswd
          sudo chown files:files /home/files
          sudo chmod 755 /home/files
          sudo mkdir -p /home/files/shared
          sudo chmod 777 /home/files/shared
          unset FPASSWORD

          echo "Configuring sshd on port 2222..."
          printf 'Port 2222\nPasswordAuthentication yes\nPermitRootLogin no\nAllowUsers files\n' | sudo tee /etc/ssh/sshd_config.d/ghbrowser.conf > /dev/null
          sudo mkdir -p /run/sshd
          echo "Disabling sshd socket-activation (it would force port 22)..."
          sudo systemctl stop ssh.socket ssh 2>/dev/null || true
          sudo systemctl disable ssh.socket 2>/dev/null || true
          sudo systemctl start ssh
          sleep 2
          ss -ltn | grep -q ':2222' || { echo "ERROR: sshd not listening on 2222:"; ss -ltn; exit 1; }
          (echo > /dev/tcp/127.0.0.1/2222) 2>/dev/null && echo "sshd reachable on 2222." || { echo "ERROR: cannot reach sshd on 2222"; exit 1; }

          echo "Starting SFTP tunnel..."
          ./cloudflared tunnel --url tcp://127.0.0.1:2222 > sftp-tunnel.log 2>&1 &
          echo $! > /tmp/sftp_tunnel.pid

          SFTP_HOST=""
          for i in $(seq 1 12); do
            SFTP_HOST=$(grep -o '[a-z0-9-]*\.trycloudflare\.com' sftp-tunnel.log 2>/dev/null | head -1)
            if [ -n "$SFTP_HOST" ]; then break; fi
            sleep 5
          done

          if [ -z "$SFTP_HOST" ]; then
            echo "WARNING: SFTP tunnel endpoint not found (TCP quick tunnels may be unavailable). Browser session continues without SFTP."
            tail -20 sftp-tunnel.log || true
            echo "UNAVAILABLE" > /tmp/sftp_state
            exit 0
          fi

          echo "$SFTP_HOST" > /tmp/sftp_host
          echo "LIVE" > /tmp/sftp_state
          echo ""
          echo "=================================================="
          echo "SFTP endpoint host: $SFTP_HOST"
          echo "PC: cloudflared access tcp --hostname $SFTP_HOST --url 127.0.0.1:2222"
          echo "Then SFTP to 127.0.0.1:2222 user files (session password)"
          echo "=================================================="
          echo ""

          {
            echo "## Files (SFTP) access"
            echo ""
            echo "**On your PC:**"
            echo "1. Install cloudflared: \`https://github.com/cloudflare/cloudflared/releases\`"
            echo "2. Run: \`cloudflared access tcp --hostname $SFTP_HOST --url 127.0.0.1:2222\`"
            echo "3. FileZilla/WinSCP: SFTP \`127.0.0.1:2222\`, user \`files\`, password = session password"
            echo ""
            echo "**Shared folder:** PC \`/home/files/shared\` <-> browser \`/shared\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce FamilySafe DNS (AdGuard, no bypass)
        run: |
          echo "Pinning host DNS to AdGuard Family..."
          sudo rm -f /etc/resolv.conf
          printf 'nameserver 94.140.14.15\nnameserver 94.140.15.16\n' | sudo tee /etc/resolv.conf > /dev/null
          cat /etc/resolv.conf
          echo "Blocking all non-AdGuard DNS (53) and DNS-over-TLS (853)..."
          for IP in 94.140.14.15 94.140.15.16; do
            sudo iptables -I OUTPUT -p udp -d "$IP" --dport 53 -j ACCEPT
            sudo iptables -I OUTPUT -p tcp -d "$IP" --dport 53 -j ACCEPT
          done
          sudo iptables -A OUTPUT -p udp --dport 53 -j DROP
          sudo iptables -A OUTPUT -p tcp --dport 53 -j DROP
          sudo iptables -A OUTPUT -p tcp --dport 853 -j DROP
          sudo iptables -A OUTPUT -p udp --dport 853 -j DROP
          sudo ip6tables -A OUTPUT -p udp --dport 53 -j DROP || true
          sudo ip6tables -A OUTPUT -p tcp --dport 53 -j DROP || true
          sudo ip6tables -A OUTPUT -p tcp --dport 853 -j DROP || true
          sudo ip6tables -A OUTPUT -p udp --dport 853 -j DROP || true
          echo "Container DNS:"
          docker exec browser cat /etc/resolv.conf
          echo "Self-test: AdGuard Family must block adult domains..."
          if curl -fsSL -m 15 'https://family.adguard-dns.com/dns-query?name=pornhub.com&type=A' -H 'accept: application/dns-json' | grep -q '0\.0\.0\.0'; then
            echo "Family filter ACTIVE (adult domain resolves to 0.0.0.0)."
          else
            echo "WARNING: filter self-test inconclusive (transient network?). DNS pinning + firewall + browser locks still apply."
          fi

      - name: Start tunnel
        run: |
          DURATION=${{ github.event.inputs.duration || '60' }}
          if ! [[ "$DURATION" =~ ^[0-9]+$ ]] || [ "$DURATION" -lt 5 ]; then DURATION=5; fi
          if [ "$DURATION" -gt 360 ]; then DURATION=360; fi

          for i in $(seq 1 10); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/auth/login 2>/dev/null || true)
            if [ "$STATUS" = "200" ]; then
              echo "Proxy ready."
              break
            fi
            sleep 2
          done

          ./cloudflared tunnel --url http://localhost:8080 > tunnel.log 2>&1 &
          CLOUDFLARED_PID=$!

          URL=""
          for i in $(seq 1 60); do
            if grep -o 'https://[^ ]*\.trycloudflare\.com' tunnel.log > /dev/null 2>&1; then
              URL=$(grep -o 'https://[^ ]*\.trycloudflare\.com' tunnel.log | head -1)
              break
            fi
            sleep 5
          done

          if [ -z "$URL" ]; then
            echo "ERROR: tunnel URL not found. cloudflared log:"
            cat tunnel.log || true
            exit 1
          fi

          echo ""
          echo "=================================================="
          echo "Browser URL: $URL"
          if [ "${{ inputs.auth_mode }}" = "none" ]; then
            echo "Password: none (open access)"
          elif [ -n "${{ inputs.vnc_password }}" ]; then
            echo "Password: <the vnc_password you entered>"
          else
            echo "Password: <your BASIC_AUTH_PASSWORD secret>"
          fi
          echo "Expires in $DURATION minutes."
          echo "FamilySafe: AdGuard Family DNS enforced, NSFW blocked."
          echo "=================================================="
          echo ""

          {
            echo "## ghBrowser (Brave) session live"
            echo ""
            echo "**URL:** $URL"
            echo ""
            if [ "${{ inputs.auth_mode }}" = "none" ]; then
              echo "**Password:** none (open access)"
            elif [ -n "${{ inputs.vnc_password }}" ]; then
              echo "**Password:** the vnc_password you entered at dispatch"
            else
              echo "**Password:** your BASIC_AUTH_PASSWORD secret"
            fi
            echo ""
            echo "Expires in $DURATION minutes."
            echo ""
            echo "FamilySafe: AdGuard Family DNS + SafeSearch enforced, NSFW blocked."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "Keeping alive for $DURATION minutes..."
          trap 'echo ""; echo "Session stopped early: runner shutdown (host maintenance/eviction or manual cancel) - not a workflow error."; exit 143' TERM
          ELAPSED=0
          FAILS=0
          LIMIT=$((DURATION * 60))
          while [ "$ELAPSED" -lt "$LIMIT" ]; do
            sleep 60
            ELAPSED=$((ELAPSED + 60))
            if ! kill -0 "$CLOUDFLARED_PID" 2>/dev/null; then
              echo "Tunnel process died - restarting cloudflared..."
              ./cloudflared tunnel --url http://localhost:8080 > tunnel.log 2>&1 &
              CLOUDFLARED_PID=$!
              FAILS=0
              sleep 10
            elif ! curl -fsSL -m 20 "$URL/auth/login" 2>/dev/null | grep -qi "ghbrowser"; then
              FAILS=$((FAILS + 1))
              echo "Tunnel health check failed ($FAILS/3)..."
              if [ "$FAILS" -ge 3 ]; then
                echo "Tunnel looks dead - restarting cloudflared..."
                kill "$CLOUDFLARED_PID" 2>/dev/null || true
                ./cloudflared tunnel --url http://localhost:8080 > tunnel.log 2>&1 &
                CLOUDFLARED_PID=$!
                FAILS=0
                sleep 10
              fi
            else
              FAILS=0
            fi
            NEW_URL=$(grep -o 'https://[^ ]*\.trycloudflare\.com' tunnel.log 2>/dev/null | tail -1)
            if [ -n "$NEW_URL" ] && [ "$NEW_URL" != "$URL" ]; then
              URL="$NEW_URL"
              echo ""
              echo "Tunnel restarted. New URL: $URL"
              echo ""
              {
                echo "## Tunnel restarted"
                echo ""
                echo "**New URL:** $URL"
              } >> "$GITHUB_STEP_SUMMARY"
            fi
            if [ "$(cat /tmp/sftp_state 2>/dev/null)" = "LIVE" ]; then
              if ! kill -0 "$(cat /tmp/sftp_tunnel.pid 2>/dev/null)" 2>/dev/null; then
                echo "SFTP tunnel died - restarting..."
                ./cloudflared tunnel --url tcp://127.0.0.1:2222 > sftp-tunnel.log 2>&1 &
                echo $! > /tmp/sftp_tunnel.pid
                sleep 10
                NEW_SFTP=$(grep -o '[a-z0-9-]*\.trycloudflare\.com' sftp-tunnel.log 2>/dev/null | tail -1)
                if [ -n "$NEW_SFTP" ]; then
                  echo "$NEW_SFTP" > /tmp/sftp_host
                  echo ""
                  echo "SFTP restarted. New endpoint host: $NEW_SFTP"
                  echo "PC: cloudflared access tcp --hostname $NEW_SFTP --url 127.0.0.1:2222"
                  echo ""
                  {
                    echo "## SFTP restarted"
                    echo ""
                    echo "**New endpoint host:** $NEW_SFTP"
                    echo "PC: \`cloudflared access tcp --hostname $NEW_SFTP --url 127.0.0.1:2222\`"
                  } >> "$GITHUB_STEP_SUMMARY"
                fi
              fi
            fi
          done
          echo "Session ended."
