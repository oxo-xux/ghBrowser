name: Debian noVNC

on:
  workflow_dispatch:
    inputs:
      duration:
        description: "Run duration (minutes)"
        required: false
        default: "350"

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v5

      - name: Start container
        run: |
          docker run -d \
            --name browser \
            --hostname debian-novnc \
            --shm-size=2g \
            -p 3000:6901 \
            -e TZ=Etc/UTC \
            debian:trixie sleep infinity

      - name: Install XFCE + VNC + noVNC
        run: |
          docker exec browser bash -c '
            apt-get update &&
            apt-get install -y --no-install-recommends \
              xfce4 xfce4-terminal dbus-x11 tigervnc-standalone-server \
              novnc websockify sudo nano curl ca-certificates
          '
          echo "Packages installed"

      - name: Create user + start VNC/noVNC
        run: |
          docker exec -u root browser bash -c '
            id -u debian >/dev/null 2>&1 || useradd -m -s /bin/bash debian
            echo "debian ALL=(ALL) NOPASSWD:ALL" > /etc/sudoers.d/debian

            mkdir -p /home/debian/.vnc /home/debian/.config/tigervnc
            printf "headless" | vncpasswd -f > /home/debian/.vnc/passwd
            chmod 600 /home/debian/.vnc/passwd

            cat > /home/debian/.vnc/xstartup << EOF
#!/bin/sh
unset SESSION_MANAGER
unset DBUS_SESSION_BUS_ADDRESS
exec dbus-launch --exit-with-session startxfce4
EOF
            chmod +x /home/debian/.vnc/xstartup
            chown -R debian:debian /home/debian

            su debian -c "
              vncserver :1 -geometry 1280x800 -depth 24 -localhost yes &&
              websockify -D --web=/usr/share/novnc/ 6901 localhost:5901
            "
          '
          echo "VNC + noVNC running"

      - name: Wait for desktop
        run: |
          echo "Waiting for desktop..."
          for i in $(seq 1 60); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000 2>/dev/null || true)
            if [ "$STATUS" = "200" ]; then
              echo "Desktop ready (attempt $i)"
              break
            fi
            echo "  attempt $i: $STATUS"
            sleep 5
          done

      - name: Setup auth proxy + login page
        env:
          WPASSWORD: ${{ secrets.BASIC_AUTH_PASSWORD }}
        run: |
          PROXY_PASSWORD="$WPASSWORD" nohup python3 .github/scripts/proxy.py > /tmp/proxy.log 2>&1 &
          sleep 2
          curl -s -o /dev/null -w "Login page: %{http_code}\n" http://localhost:8080/auth/login
          cat /tmp/proxy.log

      - name: Install cloudflared
        run: |
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            -o cloudflared
          chmod +x cloudflared

      - name: Start tunnel
        run: |
          for i in $(seq 1 10); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/auth/login 2>/dev/null || true)
            if [ "$STATUS" = "200" ]; then
              echo "Proxy healthy (attempt $i)"
              break
            fi
            echo "Proxy not ready (attempt $i): $STATUS"
            sleep 2
          done

          ./cloudflared tunnel --url http://localhost:8080 > tunnel.log 2>&1 &

          for i in $(seq 1 60); do
            if grep -o 'https://[^ ]*\.trycloudflare\.com' tunnel.log > /dev/null 2>&1; then
              URL=$(grep -o 'https://[^ ]*\.trycloudflare\.com' tunnel.log | head -1)
              echo ""
              echo "==========================================="
              echo "  ghBrowser (Debian noVNC) is LIVE!"
              echo "==========================================="
              echo "  URL:           $URL"
              echo "  Login pass:    (your BASIC_AUTH_PASSWORD)"
              echo "  VNC password:  headless"
              echo "==========================================="
              echo ""
              echo "## ghBrowser (Debian noVNC) is Live!" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "**URL:** $URL" >> $GITHUB_STEP_SUMMARY
              echo "**Login password:** \`BASIC_AUTH_PASSWORD\` secret" >> $GITHUB_STEP_SUMMARY
              echo "**VNC password:** \`headless\`" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "Direct link: $URL/vnc.html?autoconnect=true&password=headless" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "Expires in ${{ github.event.inputs.duration || '350' }} minutes." >> $GITHUB_STEP_SUMMARY
              break
            fi
            sleep 5
          done

          DURATION=${{ github.event.inputs.duration || '350' }}
          echo "Keeping alive for $DURATION minutes..."
          sleep ${DURATION}m
