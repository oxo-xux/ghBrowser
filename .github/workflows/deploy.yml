name: Run Browser

on:
  workflow_dispatch:
    inputs:
      duration:
        description: "Run duration in minutes"
        required: false
        default: "350"

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - name: Start webtop container
        run: |
          docker run -d \
            --name webtop \
            --shm-size=2g \
            -p 3000:3000 \
            -e PUID=1000 \
            -e PGID=1000 \
            -e TZ=Etc/UTC \
            -e SUBFOLDER=/ \
            lscr.io/linuxserver/webtop:ubuntu-xfce

      - name: Wait for webtop to be ready
        run: |
          echo "Waiting for webtop..."
          for i in $(seq 1 60); do
            if curl -s http://localhost:3000 > /dev/null 2>&1; then
              echo "Webtop is ready!"
              break
            fi
            sleep 5
          done

      - name: Setup nginx with basic auth
        run: |
          sudo apt-get update && sudo apt-get install -y nginx apache2-utils

          # Generate htpasswd from secret
          echo "${{ secrets.BASIC_AUTH_PASSWORD }}" | sudo htpasswd -ci /etc/nginx/.htpasswd admin

          # Write nginx config
          cat <<'NGINX' | sudo tee /etc/nginx/sites-available/browser
          server {
              listen 8080;

              auth_basic "ghBrowser";
              auth_basic_user_file /etc/nginx/.htpasswd;

              location / {
                  proxy_pass http://127.0.0.1:3000;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  proxy_http_version 1.1;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection "upgrade";
                  proxy_read_timeout 86400;
              }
          }
          NGINX

          sudo rm -f /etc/nginx/sites-enabled/default
          sudo ln -sf /etc/nginx/sites-available/browser /etc/nginx/sites-enabled/
          sudo nginx -t
          sudo systemctl restart nginx

      - name: Install cloudflared
        run: |
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            -o cloudflared
          chmod +x cloudflared

      - name: Start Cloudflare Tunnel
        run: |
          ./cloudflared tunnel --url http://localhost:8080 > tunnel.log 2>&1 &
          TUNNEL_PID=$!

          # Wait for tunnel URL
          echo "Waiting for tunnel..."
          for i in $(seq 1 30); do
            if grep -o 'https://[^ ]*\.trycloudflare\.com' tunnel.log > /dev/null 2>&1; then
              TUNNEL_URL=$(grep -o 'https://[^ ]*\.trycloudflare\.com' tunnel.log | head -1)
              echo ""
              echo "==========================================="
              echo "  Browser is LIVE!"
              echo "==========================================="
              echo ""
              echo "  URL:      $TUNNEL_URL"
              echo "  Username: admin"
              echo "  Password: (your BASIC_AUTH_PASSWORD secret)"
              echo ""
              echo "  Running for ${{ github.event.inputs.duration || '350' }} minutes"
              echo "==========================================="
              echo ""
              # Write URL to job summary
              echo "## ghBrowser is Live!" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "| | |" >> $GITHUB_STEP_SUMMARY
              echo "|---|---|" >> $GITHUB_STEP_SUMMARY
              echo "| **URL** | $TUNNEL_URL |" >> $GITHUB_STEP_SUMMARY
              echo "| **Username** | admin |" >> $GITHUB_STEP_SUMMARY
              echo "| **Password** | \`BASIC_AUTH_PASSWORD\` secret |" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "Expires in ${{ github.event.inputs.duration || '350' }} minutes." >> $GITHUB_STEP_SUMMARY
              break
            fi
            sleep 5
          done

          # Keep alive for specified duration
          DURATION=${{ github.event.inputs.duration || '350' }}
          echo "Keeping alive for $DURATION minutes..."
          sleep ${DURATION}m

          echo "Time's up! Shutting down..."
