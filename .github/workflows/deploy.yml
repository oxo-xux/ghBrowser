name: Run Browser

on:
  workflow_dispatch:
    inputs:
      duration:
        description: "Run duration in minutes"
        required: false
        default: "350"

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Start webtop container
        env:
          WPASSWORD: ${{ secrets.BASIC_AUTH_PASSWORD }}
        run: |
          docker run -d \
            --name webtop \
            --shm-size=2g \
            -p 3000:3000 \
            -e PUID=1000 \
            -e PGID=1000 \
            -e TZ=Etc/UTC \
            -e SUBFOLDER=/ \
            -e TITLE=ghBrowser \
            -e "PASSWORD=$WPASSWORD" \
            lscr.io/linuxserver/webtop:ubuntu-xfce

      - name: Wait for webtop
        run: |
          echo "Waiting for webtop to start..."
          for i in $(seq 1 120); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000 2>/dev/null || true)
            if [ "$STATUS" = "200" ] || [ "$STATUS" = "401" ]; then
              echo "Webtop is ready! (attempt $i)"
              sleep 15
              break
            fi
            echo "  attempt $i: status=$STATUS"
            sleep 5
          done

      - name: Install cloudflared
        run: |
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            -o cloudflared
          chmod +x cloudflared

      - name: Start Cloudflare Tunnel
        run: |
          ./cloudflared tunnel --url http://localhost:3000 > tunnel.log 2>&1 &

          for i in $(seq 1 60); do
            if grep -o 'https://[^ ]*\.trycloudflare\.com' tunnel.log > /dev/null 2>&1; then
              TUNNEL_URL=$(grep -o 'https://[^ ]*\.trycloudflare\.com' tunnel.log | head -1)
              echo ""
              echo "==========================================="
              echo "  Browser is LIVE!"
              echo "==========================================="
              echo "  URL:      $TUNNEL_URL"
              echo "  Password: (your BASIC_AUTH_PASSWORD secret)"
              echo "==========================================="
              echo ""
              echo "## ghBrowser is Live!" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "**URL:** $TUNNEL_URL" >> $GITHUB_STEP_SUMMARY
              echo "**Password:** \`BASIC_AUTH_PASSWORD\` secret" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "Expires in ${{ github.event.inputs.duration || '350' }} minutes." >> $GITHUB_STEP_SUMMARY
              break
            fi
            sleep 5
          done

          DURATION=${{ github.event.inputs.duration || '350' }}
          echo "Keeping alive for $DURATION minutes..."
          sleep ${DURATION}m
