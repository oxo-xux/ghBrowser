name: DuckDuckGo Browser

on:
  workflow_dispatch:
    inputs:
      duration:
        description: "Run duration (minutes)"
        required: false
        default: "350"

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v5

      - name: Start browser
        run: |
          docker run -d \
            --name browser \
            --hostname duckduckgo \
            --shm-size=2g \
            -p 3000:3000 \
            -e PUID=1000 \
            -e PGID=1000 \
            -e TZ=Etc/UTC \
            -e TITLE=ghBrowser-DuckDuckGo \
            -e FIREFOX_CLI=https://duckduckgo.com \
            lscr.io/linuxserver/firefox:latest

      - name: Wait for browser
        run: |
          echo "Waiting for browser..."
          for i in $(seq 1 120); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000 2>/dev/null || true)
            if [ "$STATUS" = "200" ] || [ "$STATUS" = "401" ]; then
              echo "Browser ready (attempt $i)"
              sleep 10
              break
            fi
            echo "  attempt $i: $STATUS"
            sleep 5
          done

      - name: Rename user to duckduckgo
        run: |
          docker exec browser bash -c '
            usermod -l duckduckgo abc &&
            groupmod -n duckduckgo abc &&
            usermod -d /home/duckduckgo -m duckduckgo &&
            chown -R duckduckgo:duckduckgo /home/duckduckgo
          ' 2>/dev/null || true

      - name: Configure DuckDuckGo
        # No official DuckDuckGo browser for Linux (Windows/Mac/Android/iOS only),
        # so ship DDG-hardened Firefox: DDG homepage + default search + DDG extension
        # via Enterprise Policy (profile-independent, survives restarts).
        run: |
          mkdir -p tmp
          cat > tmp/duck-policies.json <<'EOF'
          {
            "policies": {
              "Homepage": {
                "URL": "https://duckduckgo.com",
                "StartPage": "homepage"
              },
              "SearchEngines": {
                "Default": "DuckDuckGo"
              },
              "Extensions": {
                "Install": [
                  "https://addons.mozilla.org/firefox/downloads/latest/duckduckgo-for-firefox/latest.xpi"
                ]
              },
              "DisableTelemetry": true,
              "DontCheckDefaultBrowser": true
            }
          }
          EOF
          cat tmp/duck-policies.json
          python3 -c "import json; json.load(open('tmp/duck-policies.json')); print('policies.json valid')"

          FFDIR=$(docker exec browser bash -c 'dirname "$(readlink -f "$(which firefox)")"' | tr -d '\r\n')
          echo "Firefox dir: $FFDIR"

          docker exec browser bash -c 'mkdir -p /etc/firefox/policies'
          docker cp tmp/duck-policies.json browser:/etc/firefox/policies/policies.json
          docker exec browser bash -c 'chmod 644 /etc/firefox/policies/policies.json && cat /etc/firefox/policies/policies.json'

          # Mirror to install-dir distribution/ as fallback (path varies by distro)
          if [ -n "$FFDIR" ]; then
            docker exec browser bash -c "mkdir -p '$FFDIR/distribution' && cp /etc/firefox/policies/policies.json '$FFDIR/distribution/policies.json' && chmod 644 '$FFDIR/distribution/policies.json'" || true
          fi

          # Restart Firefox so policies + extension apply
          docker exec browser bash -c 'pkill firefox || true'
          echo "Waiting for browser restart..."
          sleep 10
          for i in $(seq 1 60); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000 2>/dev/null || true)
            if [ "$STATUS" = "200" ] || [ "$STATUS" = "401" ]; then
              echo "Browser back (attempt $i)"
              break
            fi
            echo "  attempt $i: $STATUS"
            sleep 5
          done
          docker exec browser bash -c 'cat /etc/firefox/policies/policies.json'

      - name: Setup auth proxy + login page
        env:
          WPASSWORD: ${{ secrets.BASIC_AUTH_PASSWORD }}
        run: |
          PROXY_PASSWORD="$WPASSWORD" nohup python3 .github/scripts/proxy.py > /tmp/proxy.log 2>&1 &
          sleep 2
          curl -s -o /dev/null -w "Login page: %{http_code}\n" http://localhost:8080/auth/login
          cat /tmp/proxy.log

      - name: Install cloudflared
        run: |
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            -o cloudflared
          chmod +x cloudflared

      - name: Start tunnel
        run: |
          for i in $(seq 1 10); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/auth/login 2>/dev/null || true)
            if [ "$STATUS" = "200" ]; then
              echo "Proxy healthy (attempt $i)"
              break
            fi
            echo "Proxy not ready (attempt $i): $STATUS"
            sleep 2
          done

          ./cloudflared tunnel --url http://localhost:8080 > tunnel.log 2>&1 &

          for i in $(seq 1 60); do
            if grep -o 'https://[^ ]*\.trycloudflare\.com' tunnel.log > /dev/null 2>&1; then
              URL=$(grep -o 'https://[^ ]*\.trycloudflare\.com' tunnel.log | head -1)
              echo ""
              echo "==========================================="
              echo "  ghBrowser (DuckDuckGo) is LIVE!"
              echo "==========================================="
              echo "  URL:      $URL"
              echo "  Password: (your BASIC_AUTH_PASSWORD)"
              echo "==========================================="
              echo ""
              echo "## ghBrowser (DuckDuckGo) is Live!" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "**URL:** $URL" >> $GITHUB_STEP_SUMMARY
              echo "**Password:** \`BASIC_AUTH_PASSWORD\` secret" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "Expires in ${{ github.event.inputs.duration || '350' }} minutes." >> $GITHUB_STEP_SUMMARY
              break
            fi
            sleep 5
          done

          DURATION=${{ github.event.inputs.duration || '350' }}
          echo "Keeping alive for $DURATION minutes..."
          sleep ${DURATION}m
