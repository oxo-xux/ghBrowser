name: Firefox

run-name: "ghBrowser Firefox ${{ inputs.session_id }}"

on:
  workflow_dispatch:
    inputs:
      duration:
        description: "Run duration in minutes (5-360)"
        required: false
        default: "60"
      auth_mode:
        description: "VNC login page protection"
        required: false
        default: "password"
        type: choice
        options:
          - password
          - none
      vnc_password:
        description: "Session password (empty = BASIC_AUTH_PASSWORD secret)"
        required: false
        default: ""
      session_id:
        description: "Bot session id (for run tracking)"
        required: false
        default: ""
      callback_url:
        description: "n8n webhook to notify when tunnel is live"
        required: false
        default: ""

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v5

      - name: Start browser
        run: |
          for i in 1 2 3 4 5; do
            if docker pull lscr.io/linuxserver/firefox:latest; then break; fi
            echo "image pull failed (attempt $i/5), retrying..."
            sleep $((i * 20))
            if [ "$i" = "5" ]; then echo "ERROR: could not pull browser image"; exit 1; fi
          done
          docker run -d \
            --name browser \
            --hostname firefox \
            --shm-size=2g \
            -p 3000:3000 \
            -e PUID=1000 \
            -e PGID=1000 \
            -e TZ=Etc/UTC \
            -e TITLE=ghBrowser-Firefox \
            lscr.io/linuxserver/firefox:latest

      - name: Wait for browser
        run: |
          echo "Waiting for browser..."
          for i in $(seq 1 120); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000 2>/dev/null || true)
            if [ "$STATUS" = "200" ] || [ "$STATUS" = "401" ]; then
              echo "Browser ready (attempt $i)"
              sleep 10
              break
            fi
            echo "  attempt $i: $STATUS"
            sleep 5
          done

      - name: Rename user to firefox
        run: |
          docker exec browser bash -c '
            usermod -l firefox abc &&
            groupmod -n firefox abc &&
            usermod -d /home/firefox -m firefox &&
            chown -R firefox:firefox /home/firefox
          ' 2>/dev/null || true

      - name: Setup auth proxy + login page
        env:
          INPUT_PASSWORD: ${{ inputs.vnc_password }}
          FALLBACK_PASSWORD: ${{ secrets.BASIC_AUTH_PASSWORD }}
          AUTH_MODE: ${{ inputs.auth_mode }}
        run: |
          WPASSWORD="$INPUT_PASSWORD"
          if [ "$AUTH_MODE" = "none" ]; then
            WPASSWORD=""
          elif [ -z "$WPASSWORD" ]; then
            WPASSWORD="$FALLBACK_PASSWORD"
          fi
          if [ -z "$WPASSWORD" ] && [ "$AUTH_MODE" != "none" ]; then
            echo "ERROR: auth_mode=password but no vnc_password input and no BASIC_AUTH_PASSWORD secret"
            exit 1
          fi
          if [ "$AUTH_MODE" = "none" ]; then
            echo "Auth mode: NONE (open access, no password)"
          else
            echo "Auth mode: password protected"
          fi
          PROXY_PASSWORD="$WPASSWORD" nohup python3 .github/scripts/proxy.py > /tmp/proxy.log 2>&1 &
          sleep 2
          curl -s -o /dev/null -w "Login page: %{http_code}\n" http://localhost:8080/auth/login
          cat /tmp/proxy.log

      - name: Install cloudflared
        run: |
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            -o cloudflared
          chmod +x cloudflared

      - name: Start tunnel
        run: |
          DURATION=${{ github.event.inputs.duration || '60' }}
          if ! [[ "$DURATION" =~ ^[0-9]+$ ]] || [ "$DURATION" -lt 5 ]; then DURATION=5; fi
          if [ "$DURATION" -gt 360 ]; then DURATION=360; fi
          echo "Session duration: $DURATION minutes (auth: ${{ github.event.inputs.auth_mode || 'password' }})"

          for i in $(seq 1 10); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/auth/login 2>/dev/null || true)
            if [ "$STATUS" = "200" ]; then
              echo "Proxy healthy (attempt $i)"
              break
            fi
            echo "Proxy not ready (attempt $i): $STATUS"
            sleep 2
          done

          ./cloudflared tunnel --url http://localhost:8080 > tunnel.log 2>&1 &

          for i in $(seq 1 60); do
            if grep -o 'https://[^ ]*\.trycloudflare\.com' tunnel.log > /dev/null 2>&1; then
              URL=$(grep -o 'https://[^ ]*\.trycloudflare\.com' tunnel.log | head -1)
              echo ""
              echo "==========================================="
              echo "  ghBrowser (Firefox) is LIVE!"
              echo "==========================================="
              echo "  URL:      $URL"
              if [ "${{ github.event.inputs.auth_mode }}" = "none" ]; then
                echo "  Password: (none - open access)"
              elif [ -n "${{ github.event.inputs.vnc_password }}" ]; then
                echo "  Password: (per-session password, sent to requester)"
              else
                echo "  Password: (your BASIC_AUTH_PASSWORD)"
              fi
              echo "==========================================="
              echo ""
              echo "## ghBrowser (Firefox) is Live!" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "**URL:** $URL" >> $GITHUB_STEP_SUMMARY
              if [ "${{ github.event.inputs.auth_mode }}" = "none" ]; then
                echo "**Password:** none (open access)" >> $GITHUB_STEP_SUMMARY
              elif [ -n "${{ github.event.inputs.vnc_password }}" ]; then
                echo "**Password:** per-session (sent to requester)" >> $GITHUB_STEP_SUMMARY
              else
                echo "**Password:** \`BASIC_AUTH_PASSWORD\` secret" >> $GITHUB_STEP_SUMMARY
              fi
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "Expires in $DURATION minutes." >> $GITHUB_STEP_SUMMARY
              break
            fi
            sleep 5
          done

          if [ -n "${URL:-}" ]; then
            echo "TUNNEL_URL=$URL" >> $GITHUB_ENV
          fi

          if [ -n "${{ github.event.inputs.callback_url }}" ] && [ -n "${URL:-}" ]; then
            echo "Notifying bot callback..."
            CB_SECRET="${{ secrets.GHBROWSER_CALLBACK_SECRET }}"
            if [ -z "$CB_SECRET" ]; then
              echo "WARNING: GHBROWSER_CALLBACK_SECRET repo secret not set, skipping callback"
            else
            PAYLOAD=$(jq -n \
              --arg secret "$CB_SECRET" \
              --arg session "${{ inputs.session_id }}" \
              --argjson run "${{ github.run_id }}" \
              --arg browser "Firefox" \
              --arg url "$URL" \
              --arg auth "${{ inputs.auth_mode }}" \
              --arg dur "$DURATION" \
              '{secret:$secret, session_id:$session, run_id:$run, browser:$browser, url:$url, auth_mode:$auth, duration_min:($dur|tonumber)}')
            for attempt in 1 2 3; do
              if curl -fsSL -m 20 -X POST "${{ inputs.callback_url }}" \
                -H 'Content-Type: application/json' \
                -H "X-Ghbrowser-Secret: $CB_SECRET" -d "$PAYLOAD"; then
                echo "Callback delivered (attempt $attempt)"
                break
              fi
              echo "Callback failed (attempt $attempt), retrying..."
              sleep 10
            done
            unset CB_SECRET PAYLOAD
            fi
          fi

          echo "Keeping alive for $DURATION minutes..."
          sleep ${DURATION}m
