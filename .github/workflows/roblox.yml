name: Roblox (Sober)

on:
  workflow_dispatch:
    inputs:
      duration:
        description: "Run duration (minutes)"
        required: false
        default: "350"

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v5

      - name: Start desktop
        run: |
          docker run -d \
            --name browser \
            --hostname roblox \
            --shm-size=2g \
            -p 3000:6901 \
            -e VNC_PW=headless \
            -e TZ=Etc/UTC \
            accetto/ubuntu-vnc-xfce-g3:24.04

      - name: Wait for desktop
        run: |
          echo "Waiting for desktop..."
          for i in $(seq 1 120); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000 2>/dev/null || true)
            if [ "$STATUS" = "200" ] || [ "$STATUS" = "401" ]; then
              echo "Desktop ready (attempt $i)"
              sleep 10
              break
            fi
            echo "  attempt $i: $STATUS"
            sleep 5
          done

      - name: Rename user to roblox
        run: |
          docker exec browser bash -c '
            usermod -l roblox headless &&
            groupmod -n roblox headless &&
            usermod -d /home/roblox -m roblox &&
            chown -R roblox:roblox /home/roblox
          ' 2>/dev/null || true

      - name: Install Sober (Flatpak)
        run: |
          docker exec browser bash -c '
            apt-get update && apt-get install -y curl flatpak xdg-desktop-portal-gtk libgl1 libvulkan1 mesa-utils
            flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
            flatpak install -y flathub org.vinegarhq.Sober
          '
          echo "Sober installed"

      - name: Configure Sober + Desktop
        run: |
          docker exec browser bash -c '
            mkdir -p /home/roblox/.var/app/org.vinegarhq.Sober/config/sober
            cat > /home/roblox/.var/app/org.vinegarhq.Sober/config/sober/config.json << EOF
            {
              "use_opengl": true,
              "fflags": {
                "DFIntTextureQualityOverride": 2,
                "DFFlagTextureQualityOverrideEnabled": true
              }
            }
            EOF
            chown -R roblox:roblox /home/roblox/.var/app

            mkdir -p /home/roblox/Desktop
            cat > /home/roblox/Desktop/roblox.desktop << EOF
            [Desktop Entry]
            Version=1.0
            Type=Application
            Name=Roblox
            Comment=Play Roblox with Sober
            Exec=/usr/bin/flatpak run org.vinegarhq.Sober
            Icon=org.vinegarhq.Sober
            Terminal=false
            Categories=Game;
            EOF
            chmod +x /home/roblox/Desktop/roblox.desktop
            chown -R roblox:roblox /home/roblox/Desktop
          '

      - name: Setup auth proxy + login page
        env:
          WPASSWORD: ${{ secrets.BASIC_AUTH_PASSWORD }}
        run: |
          PROXY_PASSWORD="$WPASSWORD" nohup python3 .github/scripts/proxy.py > /tmp/proxy.log 2>&1 &
          sleep 2
          curl -s -o /dev/null -w "Login page: %{http_code}\n" http://localhost:8080/auth/login
          cat /tmp/proxy.log

      - name: Install cloudflared
        run: |
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            -o cloudflared
          chmod +x cloudflared

      - name: Start tunnel
        run: |
          for i in $(seq 1 10); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/auth/login 2>/dev/null || true)
            if [ "$STATUS" = "200" ]; then
              echo "Proxy healthy (attempt $i)"
              break
            fi
            echo "Proxy not ready (attempt $i): $STATUS"
            sleep 2
          done

          ./cloudflared tunnel --url http://localhost:8080 > tunnel.log 2>&1 &

          for i in $(seq 1 60); do
            if grep -o 'https://[^ ]*\.trycloudflare\.com' tunnel.log > /dev/null 2>&1; then
              URL=$(grep -o 'https://[^ ]*\.trycloudflare\.com' tunnel.log | head -1)
              echo ""
              echo "==========================================="
              echo "  ghBrowser (Roblox Sober) is LIVE!"
              echo "==========================================="
              echo "  URL:      $URL"
              echo "  Password: (your BASIC_AUTH_PASSWORD)"
              echo "==========================================="
              echo ""
              echo "## ghBrowser (Roblox Sober) is Live!" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "**URL:** $URL" >> $GITHUB_STEP_SUMMARY
              echo "**Password:** \`BASIC_AUTH_PASSWORD\` secret" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "**How to play:**" >> $GITHUB_STEP_SUMMARY
              echo "1. Open the URL and login with your password" >> $GITHUB_STEP_SUMMARY
              echo "2. Double-click the Roblox icon on the desktop" >> $GITHUB_STEP_SUMMARY
              echo "3. Sober will prompt to install Roblox (click Install)" >> $GITHUB_STEP_SUMMARY
              echo "4. Login with your Roblox account" >> $GITHUB_STEP_SUMMARY
              echo "5. Pick a game and play!" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "Expires in ${{ github.event.inputs.duration || '350' }} minutes." >> $GITHUB_STEP_SUMMARY
              break
            fi
            sleep 5
          done

          DURATION=${{ github.event.inputs.duration || '350' }}
          echo "Keeping alive for $DURATION minutes..."
          sleep ${DURATION}m
