name: Run Browser

on:
  workflow_dispatch:
    inputs:
      duration:
        description: "Run duration (minutes)"
        required: false
        default: "350"

env:
  FIREFOX_VERSION: latest

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v5

      - name: Start Firefox
        run: |
          docker run -d \
            --name firefox \
            --shm-size=2g \
            -p 3000:3000 \
            -e PUID=1000 \
            -e PGID=1000 \
            -e TZ=Etc/UTC \
            -e TITLE=ghBrowser \
            lscr.io/linuxserver/firefox:${{ env.FIREFOX_VERSION }}

      - name: Wait for Firefox
        run: |
          echo "Waiting for Firefox..."
          for i in $(seq 1 120); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000 2>/dev/null || true)
            if [ "$STATUS" = "200" ] || [ "$STATUS" = "401" ]; then
              echo "Firefox ready (attempt $i)"
              sleep 10
              break
            fi
            echo "  attempt $i: $STATUS"
            sleep 5
          done

      - name: Cache Docker image
        uses: actions/cache@v5
        with:
          path: /tmp/docker-image.tar
          key: firefox-${{ env.FIREFOX_VERSION }}-${{ runner.os }}

      - name: Load cached image
        run: |
          if [ -f /tmp/docker-image.tar ]; then
            echo "Loading cached Firefox image..."
            docker load -i /tmp/docker-image.tar || true
          fi

      - name: Save Docker image
        if: success()
        run: |
          docker save lscr.io/linuxserver/firefox:${{ env.FIREFOX_VERSION }} -o /tmp/docker-image.tar || true

      - name: Setup auth proxy + login page
        env:
          WPASSWORD: ${{ secrets.BASIC_AUTH_PASSWORD }}
        run: |
          sudo apt-get update && sudo apt-get install -y python3-pip

          cat > /tmp/proxy.py << 'PYEOF'
          import os
          import secrets
          import socket
          import select
          import json
          from http.server import HTTPServer, BaseHTTPRequestHandler
          from urllib.parse import urlparse

          PASSWORD = os.environ["PROXY_PASSWORD"]
          UPSTREAM_HOST = "127.0.0.1"
          UPSTREAM_PORT = 3000

          sessions = {}

          LOGIN_HTML = r"""<!DOCTYPE html>
          <html lang="en">
          <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>ghBrowser - Sign In</title>
          <style>
          *{margin:0;padding:0;box-sizing:border-box}
          body{min-height:100vh;display:flex;align-items:center;justify-content:center;
          background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);font-family:'Segoe UI',system-ui,sans-serif;color:#fff}
          .card{background:rgba(255,255,255,.05);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.1);
          border-radius:20px;padding:48px 40px;width:400px;box-shadow:0 25px 60px rgba(0,0,0,.5)}
          .logo{text-align:center;margin-bottom:36px}
          .logo svg{width:64px;height:64px;margin-bottom:16px}
          .logo h1{font-size:28px;font-weight:700}
          .logo p{color:rgba(255,255,255,.5);font-size:14px;margin-top:6px}
          .form-group{margin-bottom:20px}
          label{display:block;font-size:13px;color:rgba(255,255,255,.6);margin-bottom:8px;text-transform:uppercase;letter-spacing:1px}
          input{width:100%;padding:14px 16px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.15);
          border-radius:10px;color:#fff;font-size:16px;outline:none;transition:border-color .2s}
          input:focus{border-color:#7c5cfc}
          input::placeholder{color:rgba(255,255,255,.3)}
          button{width:100%;padding:14px;background:linear-gradient(135deg,#7c5cfc,#a855f7);border:none;border-radius:10px;
          color:#fff;font-size:16px;font-weight:600;cursor:pointer;margin-top:8px;transition:opacity .2s}
          button:hover{opacity:.9}
          .error{background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.3);color:#f87171;padding:10px 14px;
          border-radius:8px;font-size:14px;margin-bottom:16px;display:none}
          .badge{text-align:center;margin-top:24px;font-size:12px;color:rgba(255,255,255,.3)}
          </style>
          </head>
          <body>
          <div class="card">
          <div class="logo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z"/>
          <path d="M2 12h20"/>
          <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
          </svg>
          <h1>ghBrowser</h1>
          <p>Private Cloud Browser</p>
          </div>
          <div class="error" id="error">Invalid password. Try again.</div>
          <form id="form">
          <div class="form-group">
          <label>Password</label>
          <input type="password" id="password" placeholder="Enter password" autofocus required>
          </div>
          <button type="submit">Sign In</button>
          </form>
          <div class="badge">End-to-end encrypted session</div>
          </div>
          <script>
          document.getElementById('form').addEventListener('submit',async e=>{
          e.preventDefault();
          const pw=document.getElementById('password').value;
          try{
          const r=await fetch('/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pw})});
          const d=await r.json();
          if(d.ok){window.location.href='/';}
          else{document.getElementById('error').style.display='block';}
          }catch(err){document.getElementById('error').style.display='block';}
          });
          </script>
          </body>
          </html>"""

          def get_session_token(cookie_header):
              if not cookie_header:
                  return None
              for c in cookie_header.split(";"):
                  c = c.strip()
                  if c.startswith("session="):
                      return c.split("=", 1)[1]
              return None

          def is_valid_session(cookie_header):
              token = get_session_token(cookie_header)
              return token and token in sessions

          def send_response_raw(conn, code, headers_text):
              status_map = {200: "OK", 302: "Found", 401: "Unauthorized"}
              status = status_map.get(code, "OK")
              resp = f"HTTP/1.1 {code} {status}\r\n{headers_text}\r\n\r\n"
              conn.sendall(resp.encode())

          def handle_http_request(conn, first_line, headers):
              method, path, _ = first_line.split(" ", 2)
              cookie = headers.get("cookie", "")
              path_only = urlparse(path).path

              if path_only == "/auth/login" and method == "GET":
                  body = LOGIN_HTML.encode()
                  hdrs = f"Content-Type: text/html\r\nContent-Length: {len(body)}"
                  send_response_raw(conn, 200, hdrs)
                  conn.sendall(body)
                  return True

              if path_only == "/favicon.ico":
                  send_response_raw(conn, 204, "")
                  return True

              if path_only == "/auth/login" and method == "POST":
                  cl = int(headers.get("content-length", 0))
                  body = conn.recv(cl) if cl else b""
                  data = json.loads(body)
                  if data.get("password") == PASSWORD:
                      token = secrets.token_hex(32)
                      sessions[token] = True
                      resp_body = b'{"ok":true}'
                      hdrs = (f"Content-Type: application/json\r\n"
                              f"Content-Length: {len(resp_body)}\r\n"
                              f"Set-Cookie: session={token}; Path=/; HttpOnly; SameSite=Lax; Max-Age=86400")
                      send_response_raw(conn, 200, hdrs)
                      conn.sendall(resp_body)
                  else:
                      resp_body = b'{"ok":false}'
                      hdrs = f"Content-Type: application/json\r\nContent-Length: {len(resp_body)}"
                      send_response_raw(conn, 401, hdrs)
                      conn.sendall(resp_body)
                  return True

              if not is_valid_session(cookie):
                  resp_body = b"Redirecting..."
                  hdrs = f"Location: /auth/login\r\nContent-Length: {len(resp_body)}"
                  send_response_raw(conn, 302, hdrs)
                  conn.sendall(resp_body)
                  return True

              return False

          def tunnel_to_upstream(client_conn, first_line, headers):
              upstream = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
              upstream.connect((UPSTREAM_HOST, UPSTREAM_PORT))
              upstream.sendall((first_line + "\r\n").encode())
              for k, v in headers.items():
                  upstream.sendall(f"{k}: {v}\r\n".encode())
              upstream.sendall(b"\r\n")

              sockets = [client_conn, upstream]
              try:
                  while True:
                      readable, _, exceptional = select.select(sockets, [], sockets, 30)
                      if exceptional:
                          break
                      for s in readable:
                          data = s.recv(65536)
                          if not data:
                              return
                          if s is client_conn:
                              upstream.sendall(data)
                          else:
                              client_conn.sendall(data)
              except Exception:
                  pass
              finally:
                  upstream.close()

          class ThreadingHTTPServer(HTTPServer):
              def process_request(self, request, client_address):
                  import threading
                  t = threading.Thread(target=self.process_request_thread, args=(request, client_address))
                  t.daemon = True
                  t.start()

              def process_request_thread(self, request, client_address):
                  try:
                      self.finish_request(request, client_address)
                  except Exception:
                      self.handle_error(request, client_address)
                  finally:
                      self.shutdown_request(request)

          class RawHandler:
              def handle(self):
                  conn = self.request
                  try:
                      raw = b""
                      while b"\r\n\r\n" not in raw:
                          chunk = conn.recv(4096)
                          if not chunk:
                              return
                          raw += chunk

                      header_end = raw.index(b"\r\n\r\n") + 4
                      header_bytes = raw[:header_end]
                      remaining = raw[header_end:]

                      lines = header_bytes.decode().split("\r\n")
                      first_line = lines[0]
                      headers = {}
                      for line in lines[1:]:
                          if ": " in line:
                              k, v = line.split(": ", 1)
                              headers[k.lower()] = v

                      method = first_line.split(" ")[0]
                      is_upgrade = "upgrade" in headers.get("connection", "").lower()

                      if is_upgrade and is_valid_session(headers.get("cookie", "")):
                          upstream = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
                          upstream.connect((UPSTREAM_HOST, UPSTREAM_PORT))
                          upstream.sendall(header_bytes)
                          if remaining:
                              upstream.sendall(remaining)

                          sockets = [conn, upstream]
                          try:
                              while True:
                                  readable, _, exceptional = select.select(sockets, [], sockets, 30)
                                  if exceptional:
                                      break
                                  for s in readable:
                                      data = s.recv(65536)
                                      if not data:
                                          return
                                      if s is conn:
                                          upstream.sendall(data)
                                      else:
                                          conn.sendall(data)
                          except Exception:
                              pass
                          finally:
                              upstream.close()
                      else:
                          if handle_http_request(conn, first_line, headers):
                              return
                          upstream = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
                          upstream.connect((UPSTREAM_HOST, UPSTREAM_PORT))
                          upstream.sendall(header_bytes)
                          if remaining:
                              upstream.sendall(remaining)

                          sockets = [conn, upstream]
                          try:
                              while True:
                                  readable, _, exceptional = select.select(sockets, [], sockets, 30)
                                  if exceptional:
                                      break
                                  for s in readable:
                                      data = s.recv(65536)
                                      if not data:
                                          return
                                      if s is conn:
                                          upstream.sendall(data)
                                      else:
                                          conn.sendall(data)
                          except Exception:
                              pass
                          finally:
                              upstream.close()
                  except Exception as e:
                      print(f"[proxy] Error: {e}")

          class ProxyServer(ThreadingHTTPServer):
              def __init__(self, addr, handler_class):
                  super().__init__(addr, handler_class)
                  self.daemon_threads = True

              def get_request(self):
                  conn, addr = self.socket.accept()
                  return conn, addr

              def process_request(self, request, client_address):
                  import threading
                  t = threading.Thread(target=self._handle_raw, args=(request, client_address))
                  t.daemon = True
                  t.start()

              def _handle_raw(self, conn, addr):
                  handler = RawHandler()
                  handler.request = conn
                  try:
                      handler.handle()
                  except Exception:
                      pass
                  finally:
                      try:
                          conn.close()
                      except Exception:
                          pass

          if __name__ == "__main__":
              print("[proxy] Starting on :8080")
              server = ProxyServer(("0.0.0.0", 8080), None)
              server.serve_forever()
          PYEOF

          PROXY_PASSWORD="$WPASSWORD" nohup python3 /tmp/proxy.py > /tmp/proxy.log 2>&1 &
          sleep 2

          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/auth/login)
          echo "Proxy login page status: $STATUS"
          cat /tmp/proxy.log

      - name: Install cloudflared
        run: |
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            -o cloudflared
          chmod +x cloudflared

      - name: Start tunnel
        run: |
          ./cloudflared tunnel --url http://localhost:8080 > tunnel.log 2>&1 &

          for i in $(seq 1 60); do
            if grep -o 'https://[^ ]*\.trycloudflare\.com' tunnel.log > /dev/null 2>&1; then
              URL=$(grep -o 'https://[^ ]*\.trycloudflare\.com' tunnel.log | head -1)
              echo ""
              echo "==========================================="
              echo "  ghBrowser is LIVE!"
              echo "==========================================="
              echo "  URL:      $URL"
              echo "  Password: (your BASIC_AUTH_PASSWORD)"
              echo "==========================================="
              echo ""
              echo "## ghBrowser is Live!" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "**URL:** $URL" >> $GITHUB_STEP_SUMMARY
              echo "**Password:** \`BASIC_AUTH_PASSWORD\` secret" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "Expires in ${{ github.event.inputs.duration || '350' }} minutes." >> $GITHUB_STEP_SUMMARY
              break
            fi
            sleep 5
          done

          DURATION=${{ github.event.inputs.duration || '350' }}
          echo "Keeping alive for $DURATION minutes..."
          sleep ${DURATION}m
