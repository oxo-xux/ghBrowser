name: Tor Browser

on:
  workflow_dispatch:
    inputs:
      duration:
        description: "Run duration (minutes)"
        required: false
        default: "350"

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v5

      - name: Start desktop
        run: |
          docker run -d \
            --name browser \
            --hostname tor \
            --shm-size=2g \
            -p 3000:3000 \
            -e PUID=1000 \
            -e PGID=1000 \
            -e TZ=Etc/UTC \
            -e TITLE=ghBrowser-Tor \
            linuxserver/webtop:debian-xfce

      - name: Wait for desktop
        run: |
          echo "Waiting for desktop..."
          for i in $(seq 1 120); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000 2>/dev/null || true)
            if [ "$STATUS" = "200" ] || [ "$STATUS" = "401" ]; then
              echo "Desktop ready (attempt $i)"
              sleep 10
              break
            fi
            echo "  attempt $i: $STATUS"
            sleep 5
          done

      - name: Install Tor Browser
        run: |
          VERSION=$(curl -fsSL https://aus1.torproject.org/torbrowser/update_3/release/downloads.json | grep -oP '"version"\s*:\s*"\K[0-9.]+' | head -1)
          echo "Latest Tor Browser: $VERSION"
          if [ -z "$VERSION" ]; then
            echo "Failed to determine Tor Browser version"
            exit 1
          fi
          docker exec browser bash -c "
            apt-get update && apt-get install -y curl xz-utils libgtk-3-0 libdbus-glib-1-2 libx11-xcb1 libxt6 libdrm2 libgbm1 libasound2 &&
            cd /tmp &&
            curl -fsSL https://dist.torproject.org/torbrowser/${VERSION}/tor-browser-linux-x86_64-${VERSION}.tar.xz -o tor.tar.xz &&
            tar xf tor.tar.xz &&
            rm -rf /opt/tor-browser &&
            mv tor-browser /opt/tor-browser &&
            rm -f tor.tar.xz &&
            chown -R abc:abc /opt/tor-browser &&
            ls /opt/tor-browser/Browser/start-tor-browser
          "
          echo "Tor Browser installed"

      - name: Launch Tor Browser
        # webtop shows a bare XFCE desktop by default — create a shortcut,
        # autostart entry, and start Tor Browser so it's actually on screen.
        run: |
          mkdir -p tmp
          cat > tmp/tor-browser.desktop <<'EOF'
          [Desktop Entry]
          Name=Tor Browser
          Comment=Tor Browser
          Exec=/opt/tor-browser/Browser/start-tor-browser --detach
          Icon=/opt/tor-browser/Browser/browser/chrome/icons/default/default128.png
          Terminal=false
          Type=Application
          Categories=Network;WebBrowser;
          StartupWMClass=Tor Browser
          EOF
          docker exec browser bash -c 'mkdir -p /usr/share/applications /home/abc/Desktop /home/abc/.config/autostart'
          docker cp tmp/tor-browser.desktop browser:/usr/share/applications/tor-browser.desktop
          docker exec browser bash -c '
            cp /usr/share/applications/tor-browser.desktop /home/abc/Desktop/tor-browser.desktop &&
            cp /usr/share/applications/tor-browser.desktop /home/abc/.config/autostart/tor-browser.desktop &&
            chmod +x /home/abc/Desktop/tor-browser.desktop &&
            chown -R abc:abc /home/abc/Desktop /home/abc/.config/autostart
          '
          # Launch as the desktop user (abc owns the XFCE session; Tor refuses root).
          # webtop/KasmVNC normally uses DISPLAY=:1, fall back to :0.
          docker exec browser bash -c '
            for D in ":1" ":0"; do
              echo "Trying DISPLAY=$D"
              if su -s /bin/bash abc -c "DISPLAY=$D /opt/tor-browser/Browser/start-tor-browser --detach" 2>&1; then
                echo "Launched on $D"
                sleep 15
                if pgrep -af "tor-browser|Browser/firefox" > /dev/null; then
                  echo "Tor Browser process running:"
                  pgrep -af "tor-browser|Browser/firefox"
                  exit 0
                fi
                echo "No process yet, trying next display"
              fi
            done
            echo "Tor Browser processes:"
            pgrep -af "tor-browser|firefox" || echo "(none found - check desktop manually)"
          '

      - name: Setup auth proxy + login page
        env:
          WPASSWORD: ${{ secrets.BASIC_AUTH_PASSWORD }}
        run: |
          PROXY_PASSWORD="$WPASSWORD" nohup python3 .github/scripts/proxy.py > /tmp/proxy.log 2>&1 &
          sleep 2
          curl -s -o /dev/null -w "Login page: %{http_code}\n" http://localhost:8080/auth/login
          cat /tmp/proxy.log

      - name: Install cloudflared
        run: |
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            -o cloudflared
          chmod +x cloudflared

      - name: Start tunnel
        run: |
          for i in $(seq 1 10); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/auth/login 2>/dev/null || true)
            if [ "$STATUS" = "200" ]; then
              echo "Proxy healthy (attempt $i)"
              break
            fi
            echo "Proxy not ready (attempt $i): $STATUS"
            sleep 2
          done

          ./cloudflared tunnel --url http://localhost:8080 > tunnel.log 2>&1 &

          for i in $(seq 1 60); do
            if grep -o 'https://[^ ]*\.trycloudflare\.com' tunnel.log > /dev/null 2>&1; then
              URL=$(grep -o 'https://[^ ]*\.trycloudflare\.com' tunnel.log | head -1)
              echo ""
              echo "==========================================="
              echo "  ghBrowser (Tor) is LIVE!"
              echo "==========================================="
              echo "  URL:      $URL"
              echo "  Password: (your BASIC_AUTH_PASSWORD)"
              echo "==========================================="
              echo ""
              echo "## ghBrowser (Tor) is Live!" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "**URL:** $URL" >> $GITHUB_STEP_SUMMARY
              echo "**Password:** \`BASIC_AUTH_PASSWORD\` secret" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "Expires in ${{ github.event.inputs.duration || '350' }} minutes." >> $GITHUB_STEP_SUMMARY
              break
            fi
            sleep 5
          done

          DURATION=${{ github.event.inputs.duration || '350' }}
          echo "Keeping alive for $DURATION minutes..."
          sleep ${DURATION}m
