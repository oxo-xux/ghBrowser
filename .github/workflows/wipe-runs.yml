name: Wipe Run History

on:
  workflow_run:
    types: [completed]
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      keep_latest:
        description: 'Finished runs to keep per workflow (0 = delete everything)'
        required: false
        default: '0'
        type: number

permissions:
  actions: write
  contents: read

concurrency:
  group: wipe-runs
  cancel-in-progress: false

jobs:
  wipe:
    # ignore runs of this workflow itself, otherwise each wipe re-triggers another wipe
    if: github.event_name != 'workflow_run' || github.event.workflow_run.name != 'Wipe Run History'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Delete finished workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          KEEP_LATEST: ${{ inputs.keep_latest || 0 }}
        run: bash .github/scripts/wipe-runs.sh